buildscript {
    repositories { mavenCentral(); maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.53' }
apply plugin: 'org.spongepowered.mixin'
group = 'me.pepperbell'
version = mod_version
base { archivesName = 'viking-continuity-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
mixin { add sourceSets.main, 'continuity.refmap.json'; config 'continuity.mixins.json' }
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            jvmArgs '-Xmx4G'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { continuity { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly 'org.jetbrains:annotations:24.0.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
    options.compilerArgs += ['-Xmaxerrs', '500']
}
tasks.named('compileJava') {
    outputs.file layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')
    outputs.file layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg')
}
tasks.withType(Jar).configureEach {
    from('LICENSE')
    manifest { attributes 'MixinConfigs': 'continuity.mixins.json', 'Implementation-Version': mod_version }
    from(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')) { rename { 'continuity.refmap.json' } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.named('processResources') {
    dependsOn 'compileJava'
    from(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')) { rename { 'continuity.refmap.json' } }
}
tasks.register('devJar', Jar) { dependsOn 'classes'; archiveClassifier = 'dev'; from sourceSets.main.output }
tasks.register('deployJarToConsumers') {
    dependsOn 'devJar'
    doLast {
        def target = file(providers.gradleProperty('consumerDir').orNull ?: '../viking-laomod')
        if (target.exists()) copy { from tasks.named('devJar', Jar).get().archiveFile; into new File(target, 'run/mods') }
    }
}
tasks.named('build') { finalizedBy 'deployJarToConsumers' }
