name: ci

on:
  push:
    branches: [viking/forge-1.20.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          check-latest: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build artifacts
        run: ./gradlew build --stacktrace --no-daemon
      - name: Verify native release
        run: python3 tools/verify-release.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: continuity-forge-1.20.1
          path: build/libs/viking-continuity-forge-1.20.1-*.jar
          if-no-files-found: error
